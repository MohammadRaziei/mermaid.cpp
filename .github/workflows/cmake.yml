name: cmake

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  # The reference SVGs are not in the repository: real Mermaid.js 12.2.0 renders them once here (Linux, pinned
  # fonts of tests/fonts) and every platform below compares against the same files.
  references:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Configure
      run: cmake -S . -B build -DMERMAID_GENERATE_REFERENCES=ON
    - name: Render the references
      run: cmake --build build --target mermaid_references
    - uses: actions/upload-artifact@v4
      with:
        name: references
        path: build/references/svg
        if-no-files-found: error

  build-and-test:
    needs: references
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: references
        path: references
    - name: Configure
      shell: bash
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMERMAID_REFERENCE_DIR="${GITHUB_WORKSPACE//\\//}/references"
    - name: Build
      run: cmake --build build -j4 --config Release
    - name: Test
      run: ctest --test-dir build --build-config Release --output-on-failure
